<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9d00ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00c8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#9d00ff" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Pin body -->
  <path d="M60,8 C40.1,8 24,24.1 24,44 C24,68 60,110 60,110 C60,110 96,68 96,44 C96,24.1 79.9,8 60,8 Z"
        fill="url(#pinGrad)" filter="url(#shadow)"/>

  <!-- Shine overlay -->
  <path d="M60,8 C40.1,8 24,24.1 24,44 C24,68 60,110 60,110 C60,110 96,68 96,44 C96,24.1 79.9,8 60,8 Z"
        fill="url(#shineGrad)"/>

  <!-- Inner white circle -->
  <circle cx="60" cy="42" r="18" fill="white" opacity="0.92" filter="url(#glow)"/>

  <!-- Location dot -->
  <circle cx="60" cy="42" r="8" fill="url(#pinGrad)"/>

  <!-- Small sparkle top-right -->
  <circle cx="84" cy="20" r="3" fill="#ff00c8" opacity="0.7"/>
  <circle cx="90" cy="30" r="1.5" fill="#9d00ff" opacity="0.5"/>
</svg>
