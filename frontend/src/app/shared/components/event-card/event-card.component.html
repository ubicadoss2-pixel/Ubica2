<article class="event-card">
  <div class="card-image" [routerLink]="['/places', event.placeId]" style="cursor: pointer;">
    <img *ngIf="event.photos && event.photos.length > 0" [src]="event.photos[0].url" [alt]="event.title" loading="lazy" />
    <img *ngIf="!event.photos || event.photos.length === 0" src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=600&q=80" alt="Placeholder" loading="lazy" />
    
    <span class="type-badge">{{ event.category?.name || 'General' }}</span>
    
  </div>

  <div class="card-body">
    <div class="card-title-row">
      <h3 [routerLink]="['/places', event.placeId]" style="cursor: pointer;">{{ event.title }}</h3>
    </div>
    
    <p class="description">{{ event.description || ('Sin descripción disponible' | translate) }}</p>
    
    <div class="location-row" style="margin-bottom: 0.2rem;">
      <svg class="lucide lucide-map-pin" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      <span class="city-name">{{ event.place?.name || 'Sede del evento' }}</span>
    </div>

    <div class="location-row" style="margin-bottom: 0.2rem;">
      <svg class="lucide lucide-clock" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span class="city-name">{{ getEventTime() }}</span>
    </div>

    <div class="location-row">
      <svg class="lucide lucide-calendar-days" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
      <span class="city-name">{{ getEventDate() }}</span>
    </div>
  </div>

  <div class="card-footer">
    <button type="button" class="btn-explore-neon" [routerLink]="['/places', event.placeId]">
      <span class="btn-text">{{ 'Ver Detalles' | translate }}</span>
      <svg class="lucide lucide-arrow-right" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </button>
    
    <div class="footer-actions">
      <button type="button" class="btn-icon-only" (click)="onViewOnMap($event)" title="Ver en mapa">
        <svg class="lucide lucide-map" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" x2="9" y1="3" y2="18"/><line x1="15" x2="15" y1="6" y2="21"/></svg>
      </button>
      <button type="button" class="btn-icon-only" (click)="onRouteTo($event)" title="Cómo llegar">
        <svg class="lucide lucide-map-pin" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      </button>
    </div>
  </div>
</article>
