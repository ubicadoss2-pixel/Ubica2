<section class="auth-wrapper">
  <div class="auth-card pastel-theme">
    <div class="brand" translate="no">
      <img src="assets/logo_final.svg" alt="UBICA2 Logo" class="auth-logo notranslate" />
      <h1>Recuperar contraseña</h1>
    </div>
    <p class="subtitle">Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form-container">
      <div class="input-group">
        <label for="email">Correo Electrónico</label>
        <div class="input-wrapper" [class.has-error]="isFieldInvalid('email')">
          <input id="email" type="email" formControlName="email" placeholder="correo@dominio.com" />
        </div>
        <div class="field-error" *ngIf="isFieldInvalid('email')">
          <span *ngIf="form.get('email')?.errors?.['required']">Este campo es obligatorio.</span>
          <span *ngIf="form.get('email')?.errors?.['email']">Debes ingresar un email válido.</span>
        </div>
      </div>

      <div class="alert error-alert" *ngIf="error()">
        <span class="icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        </span> {{ error() }}
      </div>

      <div class="alert success-alert" *ngIf="success()" style="background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); padding: 0.75rem; border-radius: 8px; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem;">
        <span class="icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </span> {{ success() }}
      </div>

      <button type="submit" [disabled]="loading() || form.invalid" class="btn-primary">
        <span class="spinner" *ngIf="loading()"></span>
        {{ loading() ? 'Enviando enlace...' : 'Enviar enlace' }}
      </button>

    </form>

    <div class="auth-footer">
      <p class="hint">
        ¿Ya la recordaste? <a routerLink="/login">Volver al login</a>
      </p>
    </div>
  </div>
</section>
