<section class="auth-wrapper">
  <div class="auth-card">
    <div class="brand" translate="no">
      <img src="assets/logo_final.svg" alt="UBICA2 Logo" class="auth-logo notranslate" />
      <h1>Crear Cuenta</h1>
    </div>
    <p class="subtitle">Únete a la comunidad de <span translate="no" class="notranslate">UBICA2</span> y descubre los mejores lugares y eventos.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form-container">
      <div class="form-grid">
        <div class="input-group">
          <label for="fullName">Nombre Completo</label>
          <div class="input-wrapper">
            <input id="fullName" type="text" formControlName="fullName" placeholder="Tu nombre real" />
          </div>
        </div>



        <div class="input-group">
          <label for="phone">Teléfono (Opcional)</label>
          <div class="input-wrapper">
            <input id="phone" type="text" formControlName="phone" placeholder="+57 3..." />
          </div>
        </div>

        <div class="input-group">
          <label for="birthDate">Fecha de Nacimiento</label>
          <div class="input-wrapper">
            <input id="birthDate" type="date" formControlName="birthDate" />
          </div>
        </div>

        <div class="input-group">
          <label for="email">Correo Electrónico</label>
          <div class="input-wrapper">
            <input id="email" type="email" formControlName="email" placeholder="correo@dominio.com" />
          </div>
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <input id="password" type="password" formControlName="password" placeholder="••••••••" />
          </div>
        </div>
      </div>

      <!-- ROLE SELECTOR -->
      <div class="role-section">
        <p class="role-label">¿Cómo quieres usar Ubica2?</p>
        <div class="role-cards">
          <button
            type="button"
            id="role-user"
            class="role-card"
            [class.selected]="form.get('role')?.value === 'USER'"
            (click)="form.get('role')?.setValue('USER')"
          >
            <span class="role-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
            </span>
            <div class="role-info">
              <strong>Explorador</strong>
              <span>Explora lugares y eventos cerca de ti</span>
            </div>
            <span class="role-check" *ngIf="form.get('role')?.value === 'USER'">✓</span>
          </button>

          <button
            type="button"
            id="role-owner"
            class="role-card"
            [class.selected]="form.get('role')?.value === 'OWNER'"
            (click)="form.get('role')?.setValue('OWNER')"
          >
            <span class="role-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </span>
            <div class="role-info">
              <strong>Propietario</strong>
              <span>Publica y gestiona tu negocio o evento</span>
            </div>
            <span class="role-check" *ngIf="form.get('role')?.value === 'OWNER'">✓</span>
          </button>
        </div>
      </div>



      <div class="alert error-alert" *ngIf="error()">
        <span class="icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        </span> {{ error() }}
      </div>

      <button type="submit" [disabled]="loading() || form.invalid" class="btn-primary">
        <span class="spinner" *ngIf="loading()"></span>
        {{ loading() ? 'Procesando...' : 'Regístrate' }}
      </button>
    </form>

    <div class="auth-footer">
      <p class="hint">
        ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
      </p>
    </div>
  </div>
</section>
